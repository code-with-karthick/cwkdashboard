{% extends 'base.html' %}

{% block title %}Add Payment - {{ block.super }}{% endblock %}
{% block page_title %}Record New Payment{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Payment Information</h5>
                <a href="{% url 'payment_list' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-2"></i>Back to List
                </a>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="student" class="form-label">Student *</label>
                        <select class="form-select" id="student" name="student" required>
                            <option value="">Select Student</option>
                            {% for student in students %}
                            <option value="{{ student.pk }}">
                                {{ student.first_name }} {{ student.last_name }} 
                                (Due: ${{ student.due_fee|floatformat:2 }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount *</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="amount" name="amount" step="0.01" 
                                   min="0" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="faculty" class="form-label">Received By</label>
                        <select class="form-select" id="faculty" name="faculty">
                            <option value="">Select Faculty Member</option>
                            {% for faculty in faculties %}
                            <option value="{{ faculty.pk }}">{{ faculty.first_name }} {{ faculty.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="remarks" class="form-label">Remarks</label>
                        <textarea class="form-control" id="remarks" name="remarks" rows="3" 
                                  placeholder="Any additional notes about this payment"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'payment_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-2"></i>Record Payment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Update amount placeholder based on selected student's due fee
document.getElementById('student').addEventListener('change', function() {
    const select = this;
    const amountInput = document.getElementById('amount');
    const selectedOption = select.options[select.selectedIndex];

    if (selectedOption.value) {
        const dueText = selectedOption.text.match(/Due: \$([0-9.]+)/);
        if (dueText) {
            amountInput.placeholder = dueText[1];
            amountInput.value = dueText[1];
        }
    } else {
        amountInput.placeholder = '0.00';
        amountInput.value = '';
    }
});
</script>
{% endblock %}
