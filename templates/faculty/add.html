{% extends 'base.html' %}

{% block title %}Add Faculty - {{ block.super }}{% endblock %}
{% block page_title %}Add New Faculty{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Faculty Information</h5>
                <a href="{% url 'faculty_list' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-2"></i>Back to List
                </a>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">First Name *</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" 
                                   required placeholder="Enter first name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Last Name *</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" 
                                   required placeholder="Enter last name">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="subject" class="form-label">Subject/Department *</label>
                        <input type="text" class="form-control" id="subject" name="subject" 
                               required placeholder="Enter subject or department">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'faculty_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-2"></i>Save Faculty
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
