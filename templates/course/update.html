{% extends 'base.html' %}

{% block title %}Edit Course - {{ block.super }}{% endblock %}
{% block page_title %}Edit Course{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Edit Course: {{ course.name }}</h5>
                <a href="{% url 'course_list' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-2"></i>Back to List
                </a>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label">Course Name *</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ course.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="fee" class="form-label">Course Fee *</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="fee" name="fee" step="0.01" 
                                   min="0" value="{{ course.fee }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="4" 
                                  required>{{ course.description }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-save me-2"></i>Update Course
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
